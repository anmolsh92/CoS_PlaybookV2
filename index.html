<script>
/* Tiny renderer for the CoS Playbook page.
   Reads the page template (with {{holes}}, <sc-for>, <sc-if>) and the Component logic,
   renders it into #app, and on every state change patches the DOM in place
   (so typing in the search box never loses focus). No libraries needed. */
(function () {
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^'.*'$|^".*"$/.test(path)) return path.slice(1, -1);
    var parts = path.split('.');
    var v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function child(scope, extra) { var s = Object.create(scope); for (var k in extra) s[k] = extra[k]; return s; }

  function build(node, scope, inSvg, out) {
    if (node.nodeType === 3) { out.push(document.createTextNode(interp(node.data, scope))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'helmet') return;
    if (tag === 'sc-for') {
      var list = lookup((node.getAttribute('list') || '').replace(/^\{\{|\}\}$/g, ''), scope) || [];
      var as = node.getAttribute('as') || 'item';
      for (var i = 0; i < list.length; i++) {
        var extra = { $index: i }; extra[as] = list[i];
        var s2 = child(scope, extra);
        for (var c = node.firstChild; c; c = c.nextSibling) build(c, s2, inSvg, out);
      }
      return;
    }
    if (tag === 'sc-if') {
      var val = lookup((node.getAttribute('value') || '').replace(/^\{\{|\}\}$/g, ''), scope);
      if (val) for (var c2 = node.firstChild; c2; c2 = c2.nextSibling) build(c2, scope, inSvg, out);
      return;
    }
    var svg = inSvg || tag === 'svg';
    var el = svg ? document.createElementNS(SVG_NS, node.nodeName.toLowerCase() === 'svg' ? 'svg' : node.nodeName) : document.createElement(tag);
    el._h = {};
    for (var a = 0; a < node.attributes.length; a++) {
      var name = node.attributes[a].name, raw = node.attributes[a].value;
      if (name.indexOf('hint-') === 0) continue;
      if (name.indexOf('on') === 0 && name.length > 2) {
        var ev = name.slice(2).toLowerCase();
        if (ev === 'change' && (tag === 'textarea' || tag === 'input')) ev = 'input';
        var m = raw.match(WHOLE);
        var fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') el._h[ev] = fn;
        continue;
      }
      var whole = raw.match(WHOLE);
      var value = whole ? lookup(whole[1], scope) : interp(raw, scope);
      if (name === 'value' && (tag === 'textarea' || tag === 'input')) { el._val = value == null ? '' : String(value); continue; }
      if (value === false || value == null) continue;
      el.setAttribute(name, value === true ? '' : String(value));
    }
    if (el._val !== undefined) el.value = el._val;
    listen(el);
    var kids = [];
    for (var k = node.firstChild; k; k = k.nextSibling) build(k, scope, svg, kids);
    for (var j = 0; j < kids.length; j++) el.appendChild(kids[j]);
    out.push(el);
  }

  function listen(el) {
    el._on = el._on || {};
    for (var ev in el._h) {
      if (el._on[ev]) continue;
      el._on[ev] = true;
      (function (type) {
        el.addEventListener(type, function (e) { var f = el._h && el._h[type]; if (f) f(e); });
      })(ev);
    }
  }

  function patch(oldEl, newEl) {
    if (oldEl.nodeType === 3) { if (oldEl.data !== newEl.data) oldEl.data = newEl.data; return; }
    // attributes
    var oa = oldEl.attributes, na = newEl.attributes, i;
    for (i = oa.length - 1; i >= 0; i--) if (!newEl.hasAttribute(oa[i].name)) oldEl.removeAttribute(oa[i].name);
    for (i = 0; i < na.length; i++) if (oldEl.getAttribute(na[i].name) !== na[i].value) oldEl.setAttribute(na[i].name, na[i].value);
    // handlers and values
    oldEl._h = newEl._h; listen(oldEl);
    if (newEl._val !== undefined && oldEl.value !== newEl._val) oldEl.value = newEl._val;
    if (oldEl.localName === 'textarea') return;
    morph(oldEl, Array.prototype.slice.call(newEl.childNodes));
  }

  function same(a, b) {
    return a.nodeType === b.nodeType && a.nodeName === b.nodeName && (a.nodeType !== 1 || a.namespaceURI === b.namespaceURI);
  }

  function morph(parent, nodes) {
    for (var i = 0; i < nodes.length; i++) {
      var old = parent.childNodes[i], nw = nodes[i];
      if (!old) parent.appendChild(nw);
      else if (same(old, nw)) patch(old, nw);
      else parent.replaceChild(nw, old);
    }
    while (parent.childNodes.length > nodes.length) parent.removeChild(parent.lastChild);
  }

  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (patchObj, cb) {
    var prev = Object.assign({}, this.state);
    var next = typeof patchObj === 'function' ? patchObj(this.state, this.props) : patchObj;
    Object.assign(this.state, next || {});
    this.__render();
    if (this.componentDidUpdate) this.componentDidUpdate(this.props, prev);
    if (cb) cb();
  };
  window.DCLogic.prototype.forceUpdate = function (cb) { this.__render(); if (cb) cb(); };

  window.mountPage = function (Component, templateEl, container) {
    var comp = new Component({});
    var rendering = false, again = false;
    comp.__render = function () {
      if (rendering) { again = true; return; }
      rendering = true;
      do {
        again = false;
        var scope = comp.renderVals() || {};
        var out = [];
        for (var c = templateEl.content.firstChild; c; c = c.nextSibling) build(c, scope, false, out);
        morph(container, out);
      } while (again);
      rendering = false;
    };
    comp.__render();
    if (comp.componentDidMount) comp.componentDidMount();
    return comp;
  };
})();

</script>
<script>

function mk(t, lead, text) { return { isP: t === 'p', isH: t === 'h', isPt: t === 'pt', isLi: t === 'li', isPr: t === 'pr', lead: lead || '', text: text || '' }; }
var p = function (t) { return mk('p', '', t); };
var h = function (t) { return mk('h', '', t); };
var pt = function (l, t) { return mk('pt', l, t); };
var li = function (l, t) { return mk('li', l, t); };
var pr = function (l, t) { return mk('pr', l, t); };

// ---------------------------------------------------------------------------
// CONTENT
// Questions, answers and bucket names come from Supabase (the live PDF) right after login.
// BUILTIN is a backup copy of the same content (from the PDF, as stored in Supabase). It is used only after login,
// when the call to Supabase for the live content fails.
var BUILTIN = {"source": "Interview_prep_Qs.pdf", "buckets": [{"bucket_id": 1, "bucket_name": "Stakeholder management and influence without authority", "tagline": "Working with senior leaders, building trust and navigating egos", "description": "This covers how to build relationships with business unit CEOs who are more senior than you, secure responses without damaging relationships, and resolve disagreements.", "challenges": ["Business unit CEOs who outrank you and do not report to you", "Follow-ups that go unanswered", "Support that is read as interference or micromanagement"], "core_question": "How do you get things done through people who do not report to you?"}, {"bucket_id": 2, "bucket_name": "Execution: Monitoring & Risk Management", "tagline": "Monitoring initiatives, driving action and managing slippages; unexpected failures, early warning signals and corrective action", "description": "This covers projects that suddenly fail despite positive updates, risks that were missed, incomplete information, and situations where the Chairperson needs a rapid assessment and recovery plan.", "challenges": ["Status reports that say green while the work says otherwise", "Milestones that slip again and again", "More initiatives than the organization has bandwidth for"], "core_question": "How do you identify problems early, respond when things go wrong, and maintain credibility when outcomes are uncertain?"}, {"bucket_id": 3, "bucket_name": "Cross-Business Coordination and Conflict Resolution", "tagline": "Aligning different business unit CEOs, functions and business priorities", "description": "This covers situations where business units have competing objectives, dependencies, conflicting priorities or disagreements over resources and ownership.", "challenges": ["Business units with competing objectives and timelines", "Costs landing on one unit while the benefits go to another", "Resistance to common, Group-wide processes"], "core_question": "How do you get multiple business leaders to work toward a common outcome when their individual priorities differ?"}, {"bucket_id": 4, "bucket_name": "Strategic Thinking and Business Judgment", "tagline": "Strategic thinking and business judgment: prioritization, strategic initiatives and decision support", "description": "This covers helping the Chairperson determine where to focus, evaluating competing initiatives, identifying business risks and opportunities, and translating broad strategic direction into concrete choices.", "challenges": ["Competing priorities and very limited Chairperson time", "Judging new opportunities on incomplete information", "Knowing what to escalate, delegate or resolve yourself"], "core_question": "How do you help the Chairperson make the right decisions across businesses?"}, {"bucket_id": 5, "bucket_name": "Difficult Conversations, Integrity, and Judgment", "tagline": "Bad news, uncomfortable truths, confidentiality and tough calls", "description": "This covers reporting negative developments, challenging optimistic narratives, delivering bad news to the Chairperson, handling politically sensitive situations and deciding when to escalate.", "challenges": ["Bad news that contradicts earlier, optimistic updates", "Candid views that could affect someone’s position", "Mistakes being concealed, and deciding when to escalate"], "core_question": "Can the Chairperson trust you to communicate the truth, especially when the truth is uncomfortable?"}, {"bucket_id": 6, "bucket_name": "Executive Representation and Diplomatic Engagement", "tagline": "Acting as the Chairperson’s proxy in high-stakes meetings and stakeholder engagements", "description": "This covers acting as the Chairperson’s proxy in board meetings, with senior internal and external stakeholders, in government and regulatory engagements, and with international partners: representing their interests, communicating their position, handling sensitive discussions and exercising sound judgment within delegated authority.", "challenges": ["Speaking for the Chairperson without exceeding your authority", "Sensitive questions you have no explicit brief for", "Being so cautious that the meeting loses its value"], "core_question": "How do you effectively act as the Chairperson’s proxy, represent their interests and make sound decisions in high-stakes engagements without exceeding your authority?"}], "questions": [{"question_id": "B1-Q1", "bucket_id": 1, "question_no": 1, "question": "You are significantly more junior than the CEO of a business unit. How would you build credibility and ensure that they take your requests seriously without feeling that you are overstepping your authority?", "answer": "Major Pointers\n1. Establish a clear mandate from the Chairperson: I would need the Chairperson's explicit request to set the context for my role and establish how I can be a valuable addition to the Chairperson's team by streamlining collaboration and engagement with the leadership of the business units.\n2. Get up to speed quickly so as to make interactions with leadership pointed: I would develop an understanding of the different business units, ongoing projects, and existing blockers. This would ensure that, from the early stages, my interactions with business unit leadership are focused and relevant, without consuming too much of their time in getting me acclimatized to the business.\n3. Position the role as outcome-oriented, not procedural: Through my communication and conduct, I would demonstrate that I have skin in the game and that my performance would be judged by how well I contribute to the performance of individual business units. This would signal a shared business interest rather than positioning myself as someone primarily responsible for procedural coordination, disconnected from business unit performance.\n4. Establish credibility through the quality of early interactions: The quality of my questions and the depth of interaction I bring to my initial conversations with business unit leaders will shape my reputation and establish credibility for the role. My understanding of the business and the relevance of my inputs should demonstrate the value I bring.\n5. Avoid demonstrating procedural effort at the cost of accountability: I should avoid actions that merely showcase that I have followed a process. For example, while submitting a brief on a major issue, I should avoid shifting the onus onto other leaders through phrases such as “As mentioned by them” or “As discussed.” Instead, I should position myself as someone willing to take accountability for actions and facilitate the resolution of the issue."}, {"question_id": "B1-Q2", "bucket_id": 1, "question_no": 2, "question": "You have followed up with a CEO multiple times for an important update, but they are not responding. How would you get the information you need without damaging the relationship?", "answer": "Major Pointers\nThe first step would be to diagnose why this situation has arisen. I see three possible scenarios:\n● The business unit CEO is occupied with day-to-day operational activities.\n● The CEO has not given the issue sufficient attention and does not consider it important enough.\n● The CEO does not value my role or wants to avoid a conversation on this particular issue.\nMy response would depend on which of these scenarios applies.\nIf the CEO is occupied with operational activities: Follow up while highlighting the urgency of the issue; keep communication crisp and convey a sense of urgency; and simplify the clutter to make it easier for the CEO to respond.\nIf the CEO does not consider the issue important enough: Use more detailed, drill-down communication, breaking the issue into subpoints; document the details for future reference; and emphasize the gravity of the issue. I favour detailed written communication because it helps with sensitization.\nIf the CEO is resistant to engaging with me: Recognize that this is the most challenging scenario. Try to initiate a conversation and build confidence that the discussion is not intended as an escalation. Establish myself as a valuable stakeholder who can help the CEO, applying the rapport-building principles discussed in Question 1. If these steps do not work, have a more direct conversation, explaining that the misalignment is affecting my work and will not serve the Chairperson well."}, {"question_id": "B1-Q3", "bucket_id": 1, "question_no": 3, "question": "You disagree with a CEO's approach to an initiative that the Chairperson considers important. How would you communicate your disagreement and influence the CEO to reconsider?", "answer": "Major Pointers\nMy experience so far in such cases is that the issue has usually not been broken down, discussed, or thought through adequately. I would drill down into the issue in three parts:\n● Break the broader disagreement into multiple subparts, then approach each subpart individually and resolve the areas where there is no disagreement.\n● For the areas where disagreement remains, examine whether either party or I myself has a bias on the issue, and discuss that explicitly.\n● Determine whether the remaining disagreement is genuinely a major judgment-call difference.\nMy objective would be to bring out the nuances of the issue and ensure that all minor aspects are thoroughly discussed or brainstormed. For the aspects where a difference remains because of a judgment call, I would document the underlying hypotheses so that they become a reference point for evaluating the decision in the future."}, {"question_id": "B1-Q4", "bucket_id": 1, "question_no": 4, "question": "A CEO feels that the Chairperson's office is interfering too much in their business and that your follow-ups amount to micromanagement. How would you address the situation?", "answer": "Major Pointers\nI would take the following actions to avoid or overcome this situation:\n1. Build credibility through detailed preparation: Whenever I attend meetings, I should prepare in detail on current problems, the context, and the business unit. This will show that I respect their time, avoid beating around the bush, and do not consume too much time trying to understand the issue.\n2. Position the role as outcome-oriented, with skin in the game: My role should come across as focused on outcomes rather than procedural alignment, so that the business unit's performance is linked to my overall performance. The quality of my questions, the insights I bring, and the new perspectives I offer for consideration should demonstrate the value I add.\n3. Assure them that my role is to provide more help: Through a range of measures, I should assure them that my role is to help them. These conversations will help me better understand their future requirements and prepare me to proactively support them, rather than waiting for a blocker or crisis to arise."}, {"question_id": "B1-Q5", "bucket_id": 1, "question_no": 5, "question": "You join a new organization where the CEOs have worked with the Chairperson for many years, while you are an outsider. How would you establish yourself in the first 90 days?", "answer": "Major Pointers\n1. Understand the source of resistance and credibility concerns: The resistance could arise from questions about my credibility: whether I am adding real value to the conversation or simply acting as an additional layer between the business unit CEO and the Group Chairperson.\n2. Establish my role in smoothing communication: I would help the business unit CEO understand how I can smooth communication between them and the Group Chairperson, particularly where they need additional support or where their viewpoint has not been adequately conveyed to the Chairperson. This would help build credibility and rapport quickly.\n3. Identify challenges and demonstrate value through resolution: I would try to understand the challenges or blockers the CEOs are facing in their live projects. If I could demonstrate that I can contribute to resolving these challenges, it would help establish my credibility quickly."}, {"question_id": "B1-Q6", "bucket_id": 1, "question_no": 6, "question": "A CEO openly challenges your competence in a meeting with other senior leaders. How would you respond in the moment and handle the situation afterward?", "answer": "Major Pointers\nThis may require a slightly tough conversation. A rebuttal may be necessary because the undermining of my role is visible to other business heads as well. If I, or anyone in this role, loses credibility or is seen as being undermined, others may lose confidence in the role too. It could create the impression that I am not significant enough to add value as an intermediary between the Chairperson and the business unit leaders.\nStay calm, but address the issue explicitly: I would explain that the lack of cooperation, timely inputs, and sharing of metrics for tracking is hurting my role and affecting the Chairperson's visibility.\nClarify that my role is not to undermine the CEO's judgment: I would explain in the same conversation that a person in my role is not there to undermine the CEO's judgment; the CEO has the best pulse of the issue.\nReinforce the support and coordination I can provide: I would clarify that my role is to understand whether support is needed, identify blockers we can help resolve, and find areas where coordination with other business units could help.\nOffer an outside perspective and gather strategic insights: In some cases, I may bring in an outside perspective for consideration. I would also gather sufficient insights from the CEO to shape the Group's long-term strategic moves."}, {"question_id": "B1-Q7", "bucket_id": 1, "question_no": 7, "question": "You need to deliver an unpopular message on behalf of the Chairperson, but you know the CEO will disagree with it. How would you communicate the message while preserving the relationship?", "answer": "Major Pointers\nThe disagreement could arise for multiple reasons:\n1. Insufficient discussion of granular aspects: The issue may not have received the brainstorming and detailed discussion it required.\n2. Incomplete representation of the business unit's viewpoint: All the business unit's viewpoints may not have been communicated to the Chairperson, or they may have been inadequately advised or presented.\n3. Differences in judgment: The parties may have different viewpoints on the issue, even after considering its various aspects.\nUltimately, it comes down to a judgment call, and both parties may have their own perspectives. The final prerogative to make the decision always rests with the Chairperson.\nThe issue arises when the business unit feels that its viewpoint has not reached the Chairperson or that the granular aspects of the issue have not received the necessary attention."}, {"question_id": "B1-Q8", "bucket_id": 1, "question_no": 8, "question": "How would you distinguish between a CEO who genuinely needs your support and one who is deliberately avoiding accountability? What would you do differently in each case?", "answer": "Major Pointers\nMy first step would be to diagnose which category the case falls into. The only way to establish this is through more pinpointed conversations, asking questions to understand the specifics.\n1. The CEO genuinely needs support: If, through the conversation, it may emerge that:\n● The business unit is facing a lack of clarity on what its roadmap of action should be.\n● The business unit is facing blockers or resource constraints for which it needs support.\n● By dissecting the issue, the business unit has reached a point that requires a judgment call, for which it needs further assistance and advice.\n2. There is resistance to taking accountability: If, despite repeated probing, the above specifics do not emerge, this signals that the business unit is facing a challenge that may reflect resistance to taking accountability for bold, significant moves.\nAdapt the approach based on the diagnosis:\n● If the CEO genuinely needs support, the channel of communication will be clear, and the discussion will address the specific issue raised.\n● If the CEO is avoiding accountability, we need to push further to bring out the specifics and encourage more internal brainstorming to identify concrete points for discussion. Only when these granular inputs are collected and presented can we offer significant help to the business unit."}, {"question_id": "B2-Q1", "bucket_id": 2, "question_no": 1, "question": "The Chairperson asks you to drive a strategic initiative involving multiple business units. How would you translate the broad objective into workstreams, milestones, owners and measurable outcomes?", "answer": "Major Pointers\nMy first objective would be to get the business unit leaders on the same page and bring out their ideas, opinions, and hypotheses on the issue.\nCollect the individual viewpoints: I would have forms or documents filled out by the individual business unit leaders and collect the information from each of them. All leaders would be asked to fill out the form separately. More often than not, this check itself will help identify divergent understandings of some foundational aspects.\nAnchor discussions around differences: Based on the information collected, I would identify differences in their standard notions and anchor discussions accordingly. Through these discussions, I would drill down into the granular aspects where there is a difference of opinion and understand why.\nFind common ground and document remaining differences: I would put significant effort into finding a middle ground or common ground. After thorough brainstorming, any differences that persist would be documented, along with why different leaders are suggesting a particular approach and the hypotheses behind their views. This would also serve as a reference for future conversations and meetings.\nUse follow-up meetings to diagnose what is holding things up: In follow-up meetings, I would drill down into the differences, challenges, and reasons something is getting stuck. These could be blockers such as administrative processes, bureaucratic hurdles, or operational resource constraints, which are more facilitation-related issues. Alternatively, something could be stuck because of a clear difference in judgment on particular aspects. All these elements need to be brought out explicitly."}, {"question_id": "B2-Q2", "bucket_id": 2, "question_no": 2, "question": "A CEO commits to completing an important milestone by a particular date but repeatedly misses deadlines. How would you handle the situation?", "answer": "Major Pointers\nMy course of action would be to have a thorough conversation to understand the reasons for missing deadlines. The issue could fall into one of three categories:\n● Very strict, ambitious deadlines were set at the beginning, and they are becoming difficult to manage.\n● Unforeseen blockers have emerged that no one could have anticipated.\n● Operational inefficiency is hurting the plan’s progress.\nThe support actions would depend on which category the issue falls into:\n● If the deadlines were too strict or ambitious: Discuss whether the deadlines need to be recalibrated to make them more realistic.\n● If there are unforeseen blockers: Discuss what support is needed from the Group Chairperson to mitigate the impact.\n● If the issue is operational inefficiency: Push for internal realignment and restructuring, and offer or encourage the adoption of best practices from other business units.\nOverall, I would sensitize the business unit leadership to the fact that repeatedly missing deadlines puts the reputation of both the leader and the business unit in a bad light.\nRepeated delays are very difficult for the Chairperson to communicate when speaking to the board or other stakeholders and can sometimes become a major embarrassment for them."}, {"question_id": "B2-Q3", "bucket_id": 2, "question_no": 3, "question": "You are preparing a weekly update for the Chairperson. Several initiatives are marked green by their respective teams, but you suspect that the underlying progress does not support those assessments. What would you do?", "answer": "Major Pointers\nBefore escalating the issue or presenting my view to the Chairperson, I would conduct a thorough assessment.\nProbe further: Ask more questions to understand the underlying progress of the initiatives.\nFollow up with the relevant teams: Engage with the business unit and reporting teams to get a better understanding of the situation.\nCollate alternate metrics: Gather additional metrics that would either validate my assumptions or nullify them.\nPresent an evidence-based assessment: Only after this thorough assessment would I present my view to the Chairperson. I would also communicate my level of confidence in the assessment and highlight specific points that I believe warrant a second look."}, {"question_id": "B2-Q4", "bucket_id": 2, "question_no": 4, "question": "The Chairperson has launched five strategic initiatives, but the organization has limited bandwidth and progress is slow across all five. How would you decide what to prioritize?", "answer": "Major Pointers\nFive strategic initiatives have been identified. Since these are already strategic initiatives, the business case and business utility for each would have been assessed. All five are equally important for us to undertake now.\nUndertake comprehensive tracking of all five initiatives: Monitor granular aspects of each initiative, including blockers, risks, and the support needed for smooth progress.\nMake every effort to deliver the initiatives: Because these initiatives have already gone through layers of due diligence and filters, we must strive to get them done, even if this requires us to move out of our comfort zone.\nReprioritize if the initiatives remain unmanageable: If it becomes clear that the initiatives cannot be managed even with additional resource assistance, I would undertake a fresh prioritization based on a matrix of factors.\nThese factors could include:\n● Business potential of the initiative.\n● Network effect of the business initiative.\n● Time-decay value of the initiative: whether it can be put on hold and undertaken or restarted in the near future.\n● Other parameters, as the case may warrant.\nLearn from the experience: Take lessons for the future about the strategic bandwidth capacity of the Group or individual business units to undertake multiple initiatives simultaneously."}, {"question_id": "B2-Q5", "bucket_id": 2, "question_no": 5, "question": "An initiative requires contributions from the sales, technology and operations teams of three different companies. Each team has its own priorities, timelines and leadership. How would you coordinate execution?", "answer": "Major Pointers\n1. Align everyone on one shared outcome\nClearly define the group-level objective, success metrics, and value to each subsidiary.\n● Ask each team to fill out a form independently at the outset, capturing its understanding of the objective, scope, priorities, and expected outcomes.\n● Compare responses to identify and resolve misalignment before execution begins.\nPrinciple: Establish a common understanding before starting execution.\n2. Establish clear ownership and accountability\nIn projects within one team, some ambiguity around responsibilities may be tolerable and resolved as work progresses. Across multiple teams or subsidiaries, clear ownership and boundaries are far more important.\n● Assign an overall project owner and named workstream owners.\n● Define deliverables, deadlines, dependencies, and decision-making authority.\n● Explicitly identify areas where responsibilities overlap or boundaries are unclear.\nPrinciple: Collective responsibility must not dilute individual accountability.\n3. Map dependencies, not just individual timelines\nUnderstand how each team's deliverables affect the others and the overall project timeline.\n● Identify critical dependencies, bottlenecks, and milestones.\n● Work backwards from the final deadline.\n● Flag delays early and establish contingency plans.\nPrinciple: Manage the interfaces between teams, not just the teams themselves.\n4. Reconcile priorities and capacity upfront\nTeams may lose enthusiasm when involvement in a group initiative comes at the expense of their existing projects.\n● Understand competing priorities, workloads, and resource constraints.\n● Create a forum for stakeholders to raise concerns openly.\n● Resolve trade-offs through reprioritization, resource allocation, or revised timelines.\nPrinciple: Treat priority conflicts as resource-allocation decisions, not merely follow-up problems.\n5. Create a well-structured, defined cadence structure\nEstablish a regular forum with relevant senior stakeholders to keep the initiative on track.\n● Review outcomes, milestones, dependencies, and risks using a consistent format.\n● Discuss blockers, support required, and cross-team disagreements.\n● Agree on actions, owners, and deadlines.\n● Escalate unresolved issues to the appropriate leadership level, including the Group Chairperson when necessary.\nPrinciple: Make reviews decision-oriented, ensuring risks are addressed early and the required support is secured."}, {"question_id": "B3-Q1", "bucket_id": 3, "question_no": 1, "question": "The Chairperson wants the Group to introduce a common process across all companies, but the CEOs argue that their businesses have different operating requirements. How would you determine what should be standardized and what should remain local?", "answer": "Major Pointers\nMy objective would be to have an in-depth discussion on why standardization makes or does not make sense.\n1. Understand the reasons for resistance: If business unit leaders argue against standardization, I would have focused conversations to bring out the reasons behind their position.\n2. Distinguish evidence-based concerns from bias: I would determine whether their concerns are based on focused, data- and insight-driven analysis showing that\nstandardization would negatively affect them, or whether the resistance stems from bias or risk aversion toward trying something new.\n3. Push for thorough brainstorming: I would push back against resistance to brainstorming and encourage a detailed discussion of the underlying arguments. This would help ensure that the discussion proceeds in the right direction."}, {"question_id": "B3-Q2", "bucket_id": 3, "question_no": 2, "question": "A cross-business initiative creates significant value for the Group overall, but most of the cost and effort fall on one business unit while the benefits accrue to another. How would you resolve the misalignment?", "answer": "Major Pointers\n1. Understand why the cost-benefit sharing is being challenged: When the business case for an initiative is created, a thorough assessment of the costs and benefits expected to accrue should already have been undertaken. If a business unit later argues that costs and benefits are not being shared proportionately, my first objective would be to understand why this concern has arisen.\n2. Identify whether unforeseen circumstances have changed the economics: Unforeseen developments may have escalated costs or reduced the benefits for a particular business unit. In such a case, the appropriate response would be to recalibrate the sharing of costs and benefits.\n3. Check whether an expense was missed in the original business case: If an expense was genuinely overlooked during the initial assessment, this would also warrant a recalibration of the cost and benefit sharing.\n4. Distinguish inefficiencies from a genuine change in the business case: A new process or initiative may introduce inefficiencies that increase costs or reduce the benefits realized by one business unit. This requires a different response: inefficiencies in one part of the organization should not penalize another unit that is performing well. The Group or the Chairperson’s team could offer support to restore performance and identify best practices from other business units.\nDrill down to the underlying cause: The overall objective is to establish why the actual costs and benefits differ from what was assessed when the business case was developed, and then choose the response based on the cause identified."}, {"question_id": "B3-Q3", "bucket_id": 3, "question_no": 3, "question": "One business unit refuses to share data or resources with another because it believes doing so would weaken its competitive advantage within the Group. How would you handle this?", "answer": "Major Pointers\nI would not immediately treat the refusal as a lack of cooperation. I would first understand what the subsidiary is protecting, why it believes sharing the data creates a disadvantage, and whether that concern is legitimate or a symptom of a broader trust or governance issue.\nWhat could be causing the refusal?\n1. Concerns about competitive sensitivity, data usage, and leakage\nThe subsidiary may fear that sharing commercially sensitive information, such as pricing, margins, customer data, sales pipelines, or product plans, could weaken its competitive position. If the data enters a common group pool, there may also be a risk of accidental leakage beyond the group, potentially compromising the subsidiary's competitive advantage in the external market.\nHow to resolve it: Clarify the purpose of the request and limit data sharing to what is necessary to extract best practices and learnings for the wider group. Establish clear access controls, confidentiality safeguards, and rules governing how the information can be used. Where possible, use aggregated or anonymized data.\n2. Competition between subsidiaries within the Group\nAlthough the companies belong to the same group, they may compete for customers, capital, leadership attention, resources, or strategic opportunities. A subsidiary may fear that sharing information will give another subsidiary an advantage.\nHow to resolve it: Establish clear rules on what information can be shared, with whom, and for what purpose. Emphasize that the objective is to identify best practices and\nenable group-wide learning, not to unnecessarily disadvantage the contributing subsidiary.\n3. Misaligned incentives between Group and subsidiary leadership\nThe Group may benefit from sharing data, while the subsidiary CEO is assessed primarily on the subsidiary's performance. If sharing creates a perceived disadvantage without a corresponding benefit, the CEO may have little incentive to cooperate.\nHow to resolve it: Make the business case explicit by showing how sharing can improve decisions, identify synergies, reduce costs, or increase revenue. Where relevant, align performance metrics with group-wide outcomes rather than focusing exclusively on individual subsidiary results.\n4. Concerns about personal risk for subsidiary leadership\nBeyond commercial considerations, subsidiary leadership may personally feel at risk. They may worry that sharing data will expose shortcomings, invite greater scrutiny, or allow other leaders to take credit for their team's work. Although this is a personal concern, the human factor is important and should not be overlooked.\nHow to resolve it: Provide clear assurance that sharing data for group-wide learning will not put the subsidiary leadership at a disadvantage. In fact, identifying and sharing successful practices can demonstrate the subsidiary's capabilities, highlight its contribution to the Group, and strengthen its leadership's standing and future prospects.\n5. Concerns about autonomy and perceived interference\nThe refusal may reflect a concern that the Group Chairperson's office is becoming too involved in the subsidiary's operations. Data requests may be perceived as an attempt to monitor or control the business rather than enable collaboration.\nHow to resolve it: Clarify the Group's legitimate need for visibility and distinguish it from interference in day-to-day decisions. Explain how the information will support better decision-making and coordination while respecting the subsidiary's operating autonomy."}, {"question_id": "B4-Q1", "bucket_id": 4, "question_no": 1, "question": "The Chairperson asks you to evaluate a new strategic opportunity for the Group. How would you assess whether it is worth pursuing and develop a recommendation?", "answer": "Major Pointers\n1. Conduct comprehensive secondary research: Begin evaluating a new strategic opportunity with detailed secondary research to understand the opportunity, the industry, and the key issues involved.\n2. Use agentic research workflows: Leverage well-designed agentic research workflows to conduct comprehensive research. Include checks for hallucinations or fabricated information, validating findings against the preliminary secondary research.\n3. Identify specific areas requiring deeper investigation: Use the initial research to drill down into specific questions or issues where more information, expert opinion, or a different perspective is required.\n4. Leverage the Group’s network to consult experts: Use the Group’s extensive network to identify and speak with relevant experts. Seek their views on specific issues, particularly those where industry opinion and practical perspectives would add value.\n5. Consolidate the findings into a report: Combine the secondary research, validation checks, and expert perspectives into a consolidated report for presentation.\nOverall approach: Use agentic research workflows to build a comprehensive preliminary understanding, then supplement that research with targeted expert conversations before consolidating the findings for decision-making."}, {"question_id": "B4-Q2", "bucket_id": 4, "question_no": 2, "question": "The Chairperson has several competing priorities and limited time. How would you determine which issues require their direct attention, which can be delegated to the CEOs, and which you can resolve yourself?", "answer": "Major Pointers\nDefine the decision-making boundaries: This segregation is a core objective of the role.\nDetermine which issues require the direct attention of the Group Chairperson or Group CEO, which can be resolved by the Chief of Staff, and which should be delegated to the discretion of business unit CEOs.\nMy core objectives\n1. Free up the Group CEO’s time and strategic bandwidth: Enable the Group CEO to focus on matters that require their direct attention, allowing them to make more informed and thoroughly considered decisions.\n2. Ensure that decisions are handled in the best possible way: Although saving time and bandwidth is a priority, the Group CEO must remain assured that matters resolved before reaching them have been handled appropriately and that decisions have been made with due consideration.\n3. Build confidence in the delegation hierarchy: The way decisions are filtered, delegated, and resolved must build trust among senior stakeholders. They should have confidence that decisions are being handled at the appropriate level and that the delegation framework is reliable.\nWiden decision-making autonomy gradually: I would initially take a cautious approach and keep the Group Chairperson or Group CEO informed about most decisions. As experience, credibility, and expertise increase, I would gradually expand the scope of decisions that can be resolved independently, thereby releasing more strategic bandwidth for the Group CEO.\nMy framework for filtering the decision-making domain\nDecisions requiring direct Group CEO attention: These would include matters requiring significant cross-functional collaboration, major crisis management, or decisions with a long-term impact on Group performance or the Group’s strategic direction.\nBusiness-specific decisions to business unit CEOs: Most decisions relating to a business unit should remain with its CEO when they can be supported by data and insights. The business unit CEO is generally best positioned to make decisions concerning their own business.\nResolve recurring or precedent-based matters independently: The Chief of Staff can step in when similar scenarios have occurred before or when established precedents\nprovide a basis for resolving the issue. As experience and credibility grow, this scope can be widened progressively.\nOverall principle: The objective is to establish a trusted decision-making hierarchy that protects the Group CEO’s strategic bandwidth without compromising decision quality, accountability, or the confidence of senior stakeholders."}, {"question_id": "B5-Q1", "bucket_id": 5, "question_no": 1, "question": "You discover that a major project is in serious trouble, despite having previously reported that it was progressing well. How would you communicate this to the Chairperson, particularly if your earlier updates were overly optimistic?", "answer": "Major Pointers\nScenario: In multiple past reports, the project was shown as green, but suddenly the project looks like it is in serious trouble or has collapsed.\n1. Diagnose why the project’s reported status differed from its eventual outcome: If a project has repeatedly been reported as green but suddenly appears to be in serious trouble or collapses, my first reaction would be to understand why the regular project updates did not reflect the underlying reality.\nIt could be any of the following reasons:\nDetermine whether incorrect data was communicated: Investigate why the reported data was wrong. Possible causes include a technical issue that caused incorrect data to be synced, the latest data not being synced or reflected in the report, or a more fundamental problem with data collection. The follow-up action should depend on the root cause of the data discrepancy.\nAssess whether the right intermediate metrics were tracked: The data may have been accurate, but the project team might not have tracked the intermediate metrics that would have provided an early indication of the project’s deteriorating health. If an\nimportant metric was obvious and should clearly have been tracked, this points to poor or incompetent execution.\nIf the metric was not obvious beforehand but would have been a valuable and insightful addition, this should be treated as a significant learning for future projects.\nDistinguish avoidable failures from genuinely unforeseen events: A project may also have been affected by an unforeseen event, such as COVID, that could not reasonably have been anticipated or for which additional preventive measures would not have been practical.\nTailor the follow-up action to the root cause: The response should depend on which category the situation falls into: incorrect data, inadequate intermediate metrics, or a genuinely unforeseen event. This distinction is important to ensure that the follow-up addresses the actual cause rather than treating every project failure in the same way."}, {"question_id": "B5-Q2", "bucket_id": 5, "question_no": 2, "question": "The Chairperson asks for your candid assessment of a CEO's performance, knowing that your feedback could have serious implications for that person's position. How would you approach the conversation?", "answer": "Major Pointers\nBuild credibility by being honest about the limits of my knowledge: In this role, I want to establish high credibility for my opinions. Whenever I am unsure or do not have full conviction, I should not hesitate to say that I am not aware of the issue, even if that makes me appear less knowledgeable in the moment.\nProvide a detailed and granular assessment of a CEO’s performance: When asked to assess a CEO’s performance on a critical issue, I would provide a detailed breakdown of the different elements that I have sufficient knowledge of, rather than offering a broad or superficial opinion.\nGround feedback in the CEO’s past record: Before providing feedback, I would gather relevant details about the CEO’s past performance and track record to ensure that the assessment is based on sufficient context.\nAvoid casual remarks and offer an opinion only after a comprehensive assessment: I would not make casual or off-the-cuff remarks on critical matters. I would share my view only after conducting a thorough assessment and reaching a position I can express with conviction.\nOverall principle: Credibility comes not from having an immediate answer to every question, but from being honest about what I know and ensuring that any opinion I do offer is well-founded and carefully considered."}, {"question_id": "B5-Q3", "bucket_id": 5, "question_no": 3, "question": "The Chairperson asks you to communicate a decision that you personally disagree with. How would you represent the decision to the organization while maintaining your own professional integrity?", "answer": "Major Pointers\nAccept that the final decision rests with the Group CEO or Chairperson: I have faced this issue multiple times in my previous startup, where I had severe disagreements with my CEO. My view is that the final decision is the prerogative of the Group CEO or Chairperson. The stakes for that individual are much higher, and once a decision is taken after due consideration, I should accept their judgment with conviction, even if I personally disagree with it.\nRecognize that decisions are not always entirely right or wrong: For most decisions, the outcome is not a simple case of something being fully right or fully wrong. How an action is followed through can determine its eventual consequences. Therefore, the objective should not be to eliminate every difference of opinion, but to ensure that the decision-making process is thorough.\nEnsure that disagreements receive due consideration: Before a final decision is taken, the disagreement should be thoroughly discussed and brainstormed. My concern is that the differing viewpoint should receive adequate attention rather than being dismissed prematurely.\nExplicitly surface areas where judgment differs: The specific aspects on which the stakeholders have different judgments should be clearly identified and brought out for discussion. This helps ensure that the decision-maker understands the nature of the disagreement.\nDocument the assumptions and hypotheses underlying the decision: Whatever decision is taken, the assumptions or hypotheses supporting it should be recorded. This documentation becomes a reference point for evaluating the decision in the future.\nUse documented assumptions to evaluate outcomes objectively: Without recording the underlying assumptions, there is no clear baseline against which to assess the decision later. Documenting them helps distinguish whether the outcome resulted from the original judgment, the assumptions proving incorrect, or how the action was subsequently executed.\nOverall principle: My objective is to ensure that every significant disagreement is preceded by thorough discussion and brainstorming, that differences in judgment are explicitly surfaced, and that the final decision and its underlying assumptions are documented. Once the decision is made, it should be accepted and pursued with conviction."}, {"question_id": "B5-Q4", "bucket_id": 5, "question_no": 4, "question": "You discover that a senior executive has made a serious mistake and is attempting to conceal it. How would you establish the facts, decide whom to inform and handle the situation?", "answer": "Major Pointers\n1. Understand the nature of the mistake and the attempted concealment: If I discover that a senior executive has made a serious mistake and is attempting to conceal it, my first step would be to investigate the issue in depth and understand what has happened.\n2. Distinguish unethical conduct from a business judgment error: If the issue involves an unethical practice, it warrants serious escalation. I would immediately report it to the Group Chairperson and work towards resolving it. If the mistake arose from a business judgment call that now appears to have been wrong, I would assess its potential impact before deciding on the next course of action.\n3. Assess the potential impact of the mistake: The severity and potential consequences of the mistake would determine whether there is room to work with the senior executive on corrective action or whether immediate escalation is necessary.\n4. If the impact is low, give the executive an opportunity to correct the mistake: Work with the executive to identify and implement corrective action, demonstrate confidence in their ability to resolve the issue, and follow up after an appropriate interval. I would\nthen communicate the matter to the Chairperson in a way that reflects confidence in the executive’s ability to fix it.\n5. If the potential impact is very high, escalate immediately: In such a case, I would have no choice but to escalate the issue to the Group CEO or Chairperson without delay.\n6. Bring the executive into the resolution process: Even when immediate escalation is necessary, I would take the executive into confidence and communicate that, although the mistake is serious, the damage may still be mitigated. I would encourage them to bring their expertise and experience to the table and work in tandem with the Group Chairperson or CEO to resolve the issue.\nOverall principle: First establish whether the issue involves unethical conduct or a business judgment error, then assess its potential impact. The response should be proportionate to the nature and severity of the issue, while creating an opportunity for corrective action wherever appropriate."}, {"question_id": "B6-Q1", "bucket_id": 6, "question_no": 1, "question": "The Chairperson asks you to represent them in a meeting with the CEOs of several companies. How would you prepare, conduct the meeting and communicate the outcomes?", "answer": "Major Pointers\n1. Represent the Group CEO effectively in their absence: When acting as a proxy for the Group CEO or Chairperson, my objective is to fill in for their absence, communicate their decisions and concerns, and collate the concerns that other stakeholders wish to convey to them.\n2. Protect the credibility of the Chairperson: Ensuring the Chairperson’s credibility is the topmost priority. I must not make casual remarks or communicate positions on their behalf without adequate understanding and preparation.\n3. Avoid being so cautious that the meetings lose their value: At the same time, I cannot play it safe or dodge every question by saying that I do not have the authority to comment. If I repeatedly do this, stakeholders may stop taking such meetings seriously when the Chairperson or Group CEO is absent. It would also fail to respect the time invested by other senior stakeholders.\n4. Prepare comprehensively before the meeting: To make the meeting meaningful, I would need to understand the Group CEO’s thinking in detail, including:\n● The decisions and concerns they want communicated to the wider audience.\n● The questions they anticipate or want addressed.\n● How firmly or sternly different concerns should be communicated.\n● The questions other stakeholders might raise, so these can be discussed with the Group CEO in advance.\n● Clear boundaries on what I can and cannot decide independently, including areas where I can exercise my own judgment.\n5. Agree on decision boundaries in advance: Establish clear go/no-go parameters with the Group CEO, identifying which matters require their explicit direction and which allow me to make a judgment call during the meeting. This will help me respond meaningfully without compromising the Chairperson’s position.\nExpand autonomy as credibility and expertise grow: As my experience, credibility, and expertise in the role increase, I can progressively seek greater autonomy to make smaller, more operational decisions independently.\nOverall principle: The objective is to represent the Group CEO faithfully while ensuring that meetings remain substantive and valuable. This requires comprehensive preparation, clear decision boundaries, and gradually increasing autonomy as trust develops."}, {"question_id": "B6-Q2", "bucket_id": 6, "question_no": 2, "question": "During a board meeting, a director asks for your opinion on a sensitive strategic issue, but you do not have explicit instructions from the Chairperson. How would you respond?", "answer": "Major Pointers\nThese are my objectives to fulfil from the beginning:\n1. Protect the credibility of the Chairperson: Ensuring the Chairperson’s credibility is the topmost priority. I must not make casual remarks or communicate positions on their behalf without adequate understanding and preparation.\n2. Avoid being so cautious that the meetings lose their value: At the same time, I cannot play it safe or dodge every question by saying that I do not have the authority to comment. If I repeatedly do this, stakeholders may stop taking such meetings seriously when the Chairperson or Group CEO is absent. It would also fail to respect the time invested by other senior stakeholders.\nMy approach\nAgree on decision boundaries in advance: Establish clear go/no-go parameters with the Group CEO, identifying which matters require their explicit direction and which allow me to make a judgment call during the meeting. This will help me respond meaningfully without compromising the Chairperson’s position.\nBreak the issue into smaller components: Rather than giving an outright yes or no, I would divide the issue into multiple substreams. Where I understood the Chairperson’s position, I could express an informed view.\nIdentify the information needed for unresolved decisions: For the parts where I could not give a definitive view, I would explain what additional information the Chairperson or Group CEO would need to make the decision, and use the meeting to gather that information.\nClose part of the decision loop before returning to the Group CEO: This approach would allow some aspects of the issue to be addressed during the meeting, reducing the number of unresolved questions. I would then return to the Group CEO with the relevant data needed to make the remaining decisions.\nOverall principle: Do not compromise the Chairperson’s credibility, but do not let excess caution make the meeting unproductive or lose its significance. Resolve what can be resolved, identify what remains uncertain, and return with the information required to make the decision."}]};

          return self.refreshSession().then(function (n) { if (!n) throw { loggedOut: true }; return ask(n.access_token); });  // token expired: renew once
        })
        .then(function (r) { if (r.status === 401) throw { loggedOut: true }; if (r.status === 403) throw { notMember: true }; if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (data) {
          if (done || seq !== self._seq) return;
          done = true; clearTimeout(timer);
          var hits = (data.results || []).filter(function (r) { return !r.type || r.type === 'qa'; }).map(function (r) {
            var at = findQ(r.question_id || ('B' + r.bucket_no + '-Q' + r.question_no));
            return at ? { kind: 'qa', b: at.b, q: at.q, match: r.match } : null;
          }).filter(function (h) { return h; });
          self.setState({ results: hits.slice(0, 4), searching: false, mode: 'hybrid' });
        })
        .catch(function (err) {
          clearTimeout(timer);
          if (err && err.loggedOut) { done = true; self.setSession(null); self.setState({ results: null, searching: false }); return; }
          if (err && err.notMember) { done = true; self.notMember(); return; }
          fallback();
        });
    } catch (e) { clearTimeout(timer); fallback(); }
  }
  highlight(title, query) {
    var terms = (query || '').toLowerCase().split(/[^a-z’'0-9]+/).filter(function (w) { return w.length > 2 && !STOP[w]; })
      .map(function (w) { var st = w.replace(/(ing|ed|es|s|ly)$/, ''); return st.length >= 3 ? st : w; });
    var parts = title.split(/([A-Za-z’'0-9]+)/);
    var segs = [];
    parts.forEach(function (p) {
      if (!p) return;
      var lw = p.toLowerCase();
      var hit = terms.length > 0 && /[a-z0-9]/i.test(p) && !STOP[lw] && terms.some(function (t) { return lw.indexOf(t) === 0 && lw.length - t.length <= 4; });
      var last = segs[segs.length - 1];
      if (last && last.hit === hit) last.t += p; else segs.push({ t: p, hit: hit, plain: !hit });
    });
    return segs;
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var b = s.bucket >= 0 ? DATA[s.bucket] : null;
    var WHY = { both: 'Matches your words and meaning', keyword: 'Matches your words', meaning: 'Similar situation' };
    var results = (s.results || []).map(function (hit, i) {
      var kind = hit.kind || 'qa';
      var title = kind === 'qa' ? DATA[hit.b].qs[hit.q].title : hit.title;
      return {
        bucket: kind === 'principle' ? 'Principle ' + hit.n : kind === 'overview' ? 'About this playbook' : DATA[hit.b].name,
        best: i === 0, cls: 'result' + (i === 0 ? ' result--best' : ''),
        why: WHY[hit.match] || WHY.keyword,
        segs: self.highlight(title, s.lastQuery),
        openLabel: kind === 'principle' ? 'Go to this principle' : kind === 'overview' ? 'Read the overview' : 'See the full answer',
        go: function () {
          if (kind === 'qa') { self.go(hit.b, hit.q); return; }
          var el = document.getElementById(kind === 'principle' ? 'principles' : 'browse');
          if (kind === 'overview') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
          if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } };
    });
    return {
      buckets: DATA.map(function (x, i) {
        var cls = 'bucket' + (s.bucket === i ? ' bucket--on' : '') + (s.bwrap ? ' bucket--wrap' : ' bucket--line');
        return { name: x.name, cls: cls, fs: s.bfs, pressed: s.bucket === i ? 'true' : 'false',
          pick: function () { self.setState({ bucket: i, open: -1 }, function () { self.toBrowse(); }); } };
      }),
      hasBucket: !!b,
      bucketName: b ? b.name : '',
      bucketMeta: b ? 'Bucket ' + (s.bucket + 1) + ' of ' + DATA.length : '',
      noBucket: !b,
      bfs: s.bfs,
      bk: b ? { tagline: b.tagline, hasTagline: !!b.tagline, about: b.about, core: b.core, hasCore: !!b.core, challenges: b.challenges.map(function (t) { return { text: t }; }) } : { tagline: '', hasTagline: false, about: '', core: '', hasCore: false, challenges: [] },
      scenarioLabel: 'The scenarios',
      closeBucket: function () { self.setState({ bucket: -1, open: -1 }, function () { self.toBrowse(); }); },
      qs: b ? b.qs.map(function (q, i) {
        return { title: q.title, blocks: q.blocks, num: 'Q' + (i + 1), rowId: 'qrow-' + i,
          open: s.open === i, closed: s.open !== i, expanded: s.open === i ? 'true' : 'false',
          toggle: function () { self.setState({ open: s.open === i ? -1 : i }); } };
      }) : [],
      chips: CHIPS.map(function (c) { return { label: c.label, go: function () { var at = findQ(c.id); if (at) self.go(at.b, at.q); } }; }),
      query: s.query,
      onQuery: function (e) {
        var v = e.target.value;
        var ta = e.target;
        ta.style.height = 'auto';
        var taH = Math.max(40, Math.min(ta.scrollHeight, 180));
        ta.style.height = taH + 'px';
        self._seq = (self._seq || 0) + 1;
        var member = !!self.state.session;
        self.setState({ taH: taH, query: v, searching: member && v.trim().length >= 3, results: member && v.trim().length >= 3 ? self.state.results : null });
        clearTimeout(self._t);
        self._t = setTimeout(function () { self.search(v); }, 350);
      },
      onSearch: function (e) { if (e && e.preventDefault) e.preventDefault(); self.search(); },
      searchingNow: !!s.searching,
      taH: s.taH || 40,
      showResults: !!s.session && s.results !== null && (results.length > 0 || !s.searching),
      showLock: !s.session && (s.query || '').trim().length >= 3,
      contentLoading: s.contentState === 'loading',
      contentDown: s.contentState === 'down',
      retryContent: function () { self.setState({ contentState: 'loading' }); self.loadContent(); },
      loggedIn: !!s.session, loggedOut: !s.session,
      showPlaybook: !!s.session && s.page === 'playbook',
      showHome: !(s.session && s.page === 'playbook'),
      showOpenBtn: !!s.session && s.page !== 'playbook',
      startPlaybook: function () { self.startPlaybook(); },
      goHome: function (e) { if (e && e.preventDefault) e.preventDefault(); self.goHome(); },
      userName: s.session && s.session.user ? (s.session.user.name || s.session.user.email) : '',
      openLogin: function () { self.openAuth('login'); },
      openSignup: function () { self.openAuth('signup'); },
      openForgot: function () { self.openAuth('forgot'); },
      logout: function () { self.logout(); },
      resend: function () { self.resendConfirmation(); },
      authOpen: !!s.authView,
      closeAuth: function () { self.closeAuth(); },
      closeAuthBg: function (e) { if (e && e.target === e.currentTarget) self.closeAuth(); },
      keepOpen: function () {},
      showTabs: false,
      isChoose: s.authView === 'choose',
      showForm: s.authView !== 'choose',
      showBackChoose: s.authView === 'login' || s.authView === 'signup',
      openChoose: function () { self.openAuth('choose'); },
      tabLoginCls: 'auth-tab' + (s.authView === 'login' ? ' auth-tab--on' : ''), tabLoginOn: s.authView === 'login' ? 'true' : 'false',
      tabSignupCls: 'auth-tab' + (s.authView === 'signup' ? ' auth-tab--on' : ''), tabSignupOn: s.authView === 'signup' ? 'true' : 'false',
      authTitle: { choose: 'Get the playbook', login: 'Welcome back', signup: 'Create your account', forgot: 'Reset your password', reset: 'Choose a new password', sent: 'Check your email', welcome: 'You are in' }[s.authView] || '',
      authSub: { choose: 'Are you a new user, or do you already have an account?', login: 'Log in to open the playbook.', signup: 'Free. Sign up once with Google or email; next time just log in.', forgot: 'Enter the email you signed up with and we will send you a reset link.', reset: 'Enter a new password for your account.', sent: 'One more step to activate your account.', welcome: '' }[s.authView] || '',
      fName: s.authView === 'signup',
      fEmail: s.authView === 'login' || s.authView === 'signup' || s.authView === 'forgot',
      fPw: s.authView === 'login' || s.authView === 'signup' || s.authView === 'reset',
      fPw2: s.authView === 'signup' || s.authView === 'reset',
      showPwRule: s.authView === 'signup' || s.authView === 'reset',
      pwLabel: s.authView === 'reset' ? 'New password' : 'Password',
      pwAuto: s.authView === 'login' ? 'current-password' : 'new-password',
      formName: s.fName, formEmail: s.fEmail, formPw: s.fPw, formPw2: s.fPw2,
      setName: function (e) { self.setState({ fName: e.target.value }); },
      setEmail: function (e) { self.setState({ fEmail: e.target.value }); },
      setPw: function (e) { self.setState({ fPw: e.target.value }); },
      setPw2: function (e) { self.setState({ fPw2: e.target.value }); },
      hasAuthErr: !!s.authErr, authErr: s.authErr,
      hasAuthInfo: !!s.authInfo, authInfo: s.authInfo,
      authBusy: !!s.authBusy,
      showSubmit: s.authView !== 'sent' && s.authView !== 'choose' && !(s.authView === 'forgot' && s.authInfo),
      submitLabel: s.authBusy ? 'Please wait...' : ({ login: 'Log in', signup: 'Create account', forgot: 'Send reset link', reset: 'Save new password', welcome: 'Continue' }[s.authView] || 'Continue'),
      authSubmit: function (e) { if (e && e.preventDefault) e.preventDefault(); self.authSubmit(); },
      showForgot: s.authView === 'login',
      showGoogle: s.authView === 'login' || s.authView === 'signup',
      google: function () { self.google(); },
      showResend: s.authView === 'sent' || (s.authView === 'login' && s.authResend),
      showBackLogin: s.authView === 'forgot' || s.authView === 'sent',
      resultsLabel: results.length ? 'Matching questions · tap one to see the answer' : 'No close match yet. Try other words, or browse the buckets above.',
      results: results
    };
  }
}

mountPage(Component, document.getElementById('page-template'), document.getElementById('app'));
